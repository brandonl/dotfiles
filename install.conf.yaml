- defaults:
    shell:
      stdin: true
      stdout: true
      stderr: true
    link:
      relink: true
      force: true
      create: true

- clean: ["~"]

- shell:
    - [
        hash brew || /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)",
      ]
    - [
        ./scripts/brew-bundle-install.sh,
        "Install and upgrade Homebrew packages from Brewfile",
      ]
    - [
        ./scripts/brew-autoupdate.sh,
        "Enable brew autoupdate (weekly upgrade/cleanup)",
      ]
    - [git submodule sync --recursive]
    - [git submodule update --init --recursive]
    - [mkdir -p $HOME/workspace]

# Could just use gnu-stow
- link:
    ~/.zlogin:
    ~/.zshrc:
    ~/.vimrc:
    ~/:
      prefix: "."
      glob: true
      path: git/*
    ~/.config/:
      glob: true
      path: config/**
    ~/.ssh/:
      glob: true
      path: ssh/*
    ~/.zsh/:
      glob: true
      path: zsh/*
      exclude: [plugins/*, themes/*]
    ~/.zsh/omz/custom/plugins/:
      glob: true
      path: zsh/plugins/*

- shell:
    - [
        cp -rf fonts/monaco-nerd-fonts/fonts/* ~/Library/Fonts/,
        "Installing font 'Monaco for Powerline'",
      ]
    - [
        cp -rf fonts/Monaspace/*.otf ~/Library/Fonts/,
        "Installing font 'Monaspace nerdfont'",
      ]
    - [./scripts/run-macosx-if-enabled.sh]
    - [./scripts/mise-install.sh, "Install mise global runtimes"]
    - [source $HOME/.zshrc]
