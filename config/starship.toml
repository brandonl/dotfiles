"$schema" = 'https://starship.rs/config-schema.json'
palette = "catppuccin_mocha"
command_timeout = 1000
right_format = "$cmd_duration$aws"

[aws]
symbol = ""
format = 'on [$symbol]($style) '
force_display = false

[buf]
symbol = " "

[c]
symbol = " "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[cmd_duration]
min_time = 2_000
format = 'took [$duration]($style) '
style = "bold yellow"

[conda]
symbol = " "

[crystal]
symbol = " "

[dart]
symbol = " "

[directory]
read_only = " 󰌾"
style = "bold lavender"
truncation_length = 4
truncate_to_repo = true

[direnv]
format = '[$symbol$loaded]($style) '

[docker_context]
symbol = " "
only_with_files = true

[elixir]
symbol = " "

[elm]
symbol = " "

[fennel]
symbol = " "

[fossil_branch]
symbol = " "

[git_branch]
symbol = " "
style = "bold mauve"

[git_state]
format = '([\($state( $progress_current/$progress_total)\)]($style) )'

[git_status]
ignore_submodules = true

[gcloud]
disabled = true

[golang]
disabled = true
symbol = " "

[guix_shell]
symbol = " "

[haskell]
symbol = " "

[haxe]
symbol = " "

[hg_branch]
symbol = " "

[hostname]
ssh_symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[kotlin]
symbol = " "

[lua]
symbol = " "

[memory_usage]
symbol = "󰍛 "

[meson]
symbol = "󰔷 "

[nim]
symbol = "󰆥 "

[nix_shell]
symbol = " "

# Version managers via mise; avoid spawning Homebrew/system runtimes in the prompt.
[nodejs]
disabled = true

[custom.mise]
command = "bash ~/.config/mise/starship-prompt.sh"
detect_files = [
  ".nvmrc",
  ".node-version",
  ".python-version",
  ".python-versions",
  ".go-version",
  "go.mod",
  ".ruby-version",
  ".tool-versions",
  "mise.toml",
  ".mise.toml",
  ".mise.local.toml",
]
format = "via [$output]($style) "
style = "bold peach"

[ocaml]
symbol = " "

