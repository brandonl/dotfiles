model = "gpt-6-sol"
model_reasoning_effort = "high"
personality = "pragmatic"
service_tier = "default"

[desktop]
ambient-suggestions-enabled = false
appearanceDarkCodeThemeId = "catppuccin"
codeFontSize = 16
computerUseAlwaysHidePictureInPicture = false
conversationDetailMode = "STEPS_COMMANDS"
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh"]
followUpQueueMode = "queue"
git-branch-prefix = ""
sansFontSize = 16
show-context-window-usage = true

[desktop.appearanceDarkChromeTheme]
accent = "#cba6f7"
contrast = 60
ink = "#cdd6f4"
opaqueWindows = false
surface = "#1e1e2e"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#a6e3a1"
diffRemoved = "#f38ba8"
skill = "#cba6f7"

[desktop.open-in-target-preferences]
global = "zed"

[features]
hooks = true
js_repl = false
memories = true

[memories]
generate_memories = true
use_memories = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "thread-name", "git-branch", "pull-request-number", "context-used", "context-window-size", "used-tokens", "task-progress"]
status_line_use_colors = true
