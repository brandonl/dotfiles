# Managed in dotfiles → ~/.config/mise/config.toml via install

[tools]
node = "24.9.0"
python = "3.10.10"
go = "1.23.1"
ruby = "3.4"
tuist = "4.195.17"
usage = "latest"
"go:github.com/GoTestTools/limgo/cmd/limgo" = "v1.0.0"
"go:github.com/daixiang0/gci" = "v0.13.7"
"go:github.com/fzipp/gocyclo/cmd/gocyclo" = "v0.6.0"
"go:github.com/go-delve/delve/cmd/dlv" = "v1.26.3"
"go:github.com/go-jet/jet/v2/cmd/jet" = "v2.11.1"
"go:github.com/gotesttools/gotestfmt/v2/cmd/gotestfmt" = "v2.5.0"
"go:github.com/pressly/goose/v3/cmd/goose" = "v3.18.0"
"go:github.com/segmentio/golines" = "v0.13.0"
"go:github.com/vektra/mockery/v2" = "v2.43.2"
"go:github.com/yagipy/maintidx/cmd/maintidx" = "v1.0.0"
"go:golang.org/x/tools/cmd/goimports" = "v0.42.0"
"go:golang.org/x/tools/gopls" = "v0.22.0"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "v1.3.0"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "v1.36.10"
"go:honnef.co/go/tools/cmd/staticcheck" = "v0.6.1"
"go:mvdan.cc/gofumpt" = "v0.8.0"

[settings]
idiomatic_version_file_enable_tools = ["node", "python", "go"]
