# Dotfiles → ~/.config/atuin/config.toml
# Root keys must stay above [table] headers or they attach to the previous section.

search_mode = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_key_binding = "directory"
search_mode_shell_up_key_binding = "fuzzy"
workspaces = true

style = "compact"
inline_height = 25
# <= inline height → ultracompact: drops [ DIRECTORY ] bar, uses D> on row instead
auto_hide_height = 30
show_numeric_shortcuts = false
show_help = false
show_tabs = false
show_preview = false
enter_accept = true
exit_mode = "return-original"
update_check = false

secrets_filter = true
history_filter = [
  "^(ls|cd|pwd|exit|clear)(\\s|$)",
  "(?i)AWS_SECRET_ACCESS_KEY",
  "(?i)AWS_SESSION_TOKEN",
  "(?i)(password|passwd|token|api[_-]?key)\\s*=",
  "--token[= ]\\S+",
]

[theme]
name = "catppuccin-mocha-sky"

[search]
filters = ["global", "directory", "workspace"]

[ui]
# time default width is 9; 7 fits "22m ago" and trims dead space before command
columns = [{ type = "time", width = 7 }, "command"]

# Sync (optional): atuin register && uncomment
# auto_sync = true
# sync_frequency = "5m"
