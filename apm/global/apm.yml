name: dotfiles-global
version: 1.0.0
targets:
  - claude
  - codex
  - agent-skills
dependencies:
  apm:
    - path: ~/dotfiles/apm/global/plugins/personal
    - git: affaan-m/everything-claude-code
      path: skills/hexagonal-architecture
    - git: mattpocock/skills
      skills:
        - diagnosing-bugs
        - grill-me
        - grilling
        - grill-with-docs
        - handoff
        - improve-codebase-architecture
        - tdd
        - research
        - writing-for-agents
    - git: alibaba/open-code-review
      path: skills/open-code-review
    - git: ayghri/i-have-adhd
      path: skills/i-have-adhd
    - git: dreambigou/eli5
      path: skills/eli5
    - git: lukeberrypi/skills
      path: skills/remove-dumb-comments
    - git: artemnovitckii/content-skills
      path: dumbify
    - git: breadoncee/dumb-it-down
    - git: othmanadi/planning-with-files
      path: skills/planning-with-files
    - git: stablyai/orca
      skills:
        - computer-use
        - orca-cli
        - orchestration
  mcp:
    - name: context7
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "@upstash/context7-mcp"]
